<!DOCTYPE html>
<html>
<head>
    <title>Dropdown Selection</title>
</head>
<body>

<div style="padding: 40px; color: black; background: white; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;">
    <p style="font-size: 18px;">Ist Deutsch deine Muttersprache??</p>
    
    <select id="dropdown" style="font-size: 16px; padding: 10px; margin: 20px 0;">
        <option value="" disabled selected>Select...</option>
        
            <option value="Ja">Ja</option>
        
            <option value="Nein">Nein</option>
        
    </select>
    
    <button id="nextBtn" disabled
            style="padding: 10px 20px; font-size: 16px; background: #007BFF; color: white; border: none; border-radius: 6px;">
        Next
    </button>
</div>

<script>
    const dropdown = document.getElementById("dropdown");
    const btn = document.getElementById("nextBtn");
    const start = Date.now();

    dropdown.addEventListener("change", function() {
        btn.disabled = !dropdown.value;
    });

    btn.addEventListener("click", function() {
        const selected = dropdown.value;
        const duration = Date.now() - start;

        // Save to localStorage
        localStorage.setItem("", selected);
        localStorage.setItem("_time", duration);

        // Go to next page
        //window.location.href = "page_5.html";
        window.parent.postMessage({ action: "next" }, "*");
    });
</script>

</body>
<script>
  history.replaceState(null, "", window.location.href);
  window.addEventListener("popstate", function () {
    location.replace(window.location.href);
  });
</script>
</html>
