<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Popup Question</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            background: rgba(83, 108, 199, 0.288);
            font-family: Arial, sans-serif;
        }

        #popup {
            width: 33vw;
            height: 33vh;
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
            margin: auto;
            position: absolute;
            top: 0; bottom: 0; left: 0; right: 0;
        }

        #popup h2 {
            text-align: center;
            color: black;
        }

        #popup button {
            padding: 10px;
            margin: 5px;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1em;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="popup">
        <h2>Wie sicher bist du dir?</h2>
        <div>
            
                <button style="background:gray;" onclick="submitPopup('Nicht so sicher')">Nicht so sicher</button>
            
                <button style="background:gray;" onclick="submitPopup('Ziemlich sicher')">Ziemlich sicher</button>
            
                <button style="background:gray;" onclick="submitPopup('Ganz sicher')">Ganz sicher</button>
            
        </div>
    </div>

    <script>
        const startTime = Date.now();
        function submitPopup(answer) {
            const duration = Date.now() - startTime;

            // Save to localStorage
            localStorage.setItem("7", answer);
            localStorage.setItem("7_time", duration);

            // Go to next step
            window.location.href = "page_8.html";
        }
    </script>
</body>
</html>
