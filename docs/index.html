<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Experiment</title>
    <style>
        html, body { margin: 0; padding: 0; height: 100%; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>
    <iframe id="main" src=""></iframe>
    <script>
        const preTask = ["page_1.html", "page_2.html", "page_3.html", "page_4.html"];
        const mainBlocks = [["page_5.html", "page_6.html", "page_7.html", "page_8.html", "page_9.html"], ["page_10.html", "page_11.html", "page_12.html", "page_13.html", "page_14.html"], ["page_15.html", "page_16.html", "page_17.html", "page_18.html", "page_19.html"], ["page_20.html", "page_21.html", "page_22.html", "page_23.html", "page_24.html"]];
        const postTask = ["page_25.html"];

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        let shuffledMainGroups = shuffle(mainBlocks.slice());
        let mainSequence = [];
        shuffledMainGroups.forEach(group => {
            mainSequence = mainSequence.concat(group);
        });

        const fullSequence = preTask.concat(mainSequence, postTask);
        let currentIndex = 0;
        const iframe = document.getElementById("main");

        function loadPage(index) {
            if (index < fullSequence.length) {
                iframe.src = fullSequence[index];
            } else {
                alert("Experiment complete!");
            }
        }

        loadPage(currentIndex);

        window.addEventListener("message", function(event) {
            if (event.data && event.data.action === "next") {
                currentIndex++;
                loadPage(currentIndex);
            }
        });
    </script>
</body>
</html>
