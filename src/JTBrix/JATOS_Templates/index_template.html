<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Experiment</title>
    <script src="jatos.js"></script>
    <style>
        html, body { margin: 0; padding: 0; height: 100%; }
        #container { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div id="container"></div>
    <script type="module">
        const preTask = {{ pre_task | tojson }};
        const mainBlocks = {{ main_blocks | tojson }};
        const postTask = {{ post_task | tojson }};

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        let shuffledMainGroups = shuffle(mainBlocks.slice());
        let mainSequence = [];
        shuffledMainGroups.forEach(group => {
            mainSequence = mainSequence.concat(group);
        });

        const fullSequence = preTask.concat(mainSequence, postTask);
        let currentIndex = 0;
        const container = document.getElementById("container");

        function loadNextPage() {
            currentIndex++;
            loadPageFromJS(currentIndex);
        }

        function loadPageFromJS(index) {
            if (index >= fullSequence.length) {
                jatos.submitResultData(window.jatosData || {}, jatos.endStudy);
                alert("Experiment complete!");
                return;
            }

            const pageFile = fullSequence[index];
            import(`./pages/${pageFile}`)
                .then(module => {
                    container.innerHTML = "";
                    module.loadPage(container, loadNextPage);
                })
                .catch(err => {
                    console.error("Failed to load", pageFile, err);
                    container.innerHTML = `<p>Error loading page ${pageFile}</p>`;
                });
        }

        jatos.onLoad(() => {
            loadPageFromJS(currentIndex);
        });
    </script>
</body>
</html>
