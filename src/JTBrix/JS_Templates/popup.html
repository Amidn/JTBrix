<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Popup Question</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            background: rgba(83, 108, 199, 0.288);
            font-family: Arial, sans-serif;
        }

        #popup {
            width: 33vw;
            height: 33vh;
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
            margin: auto;
            position: absolute;
            top: 0; bottom: 0; left: 0; right: 0;
        }

        #popup h2 {
            text-align: center;
            color: black;
        }

        #popup button {
            padding: 10px;
            margin: 5px;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1em;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="popup">
        <h2>{{ question }}</h2>
        <div>
            {% for option, color in options_colors %}
                <button style="background:{{ color }};" onclick="submitPopup('{{ option }}')">{{ option }}</button>
            {% endfor %}
        </div>
    </div>

    <script>
        const startTime = Date.now();
        function submitPopup(answer) {
            const duration = Date.now() - startTime;

            // Save to localStorage
            localStorage.setItem("{{ id }}", answer);
            localStorage.setItem("{{ id }}_time", duration);

            // Go to next step
            //window.location.href = "page_{{ next_step }}.html";
            window.parent.postMessage({ action: "next" }, "*");
        }
    </script>
</body>
<script>
  history.replaceState(null, "", window.location.href);
  window.addEventListener("popstate", function () {
    location.replace(window.location.href);
  });
</script>
</html>
