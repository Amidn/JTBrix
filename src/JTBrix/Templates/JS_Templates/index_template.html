<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Experiment</title>
    <style>
        html, body { margin: 0; padding: 0; height: 100%; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>
    <iframe id="main" src=""></iframe>
    <script>
        const preTask = {{ pre_task | tojson }};
        const mainBlocks = {{ main_blocks | tojson }};
        const postTask = {{ post_task | tojson }};

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        let shuffledMainGroups = shuffle(mainBlocks.slice());
        let mainSequence = [];
        shuffledMainGroups.forEach(group => {
            mainSequence = mainSequence.concat(group);
        });

        const fullSequence = preTask.concat(mainSequence, postTask);
        let currentIndex = 0;
        const iframe = document.getElementById("main");

        function loadPage(index) {
            if (index < fullSequence.length) {
                iframe.src = fullSequence[index];
            } else {
                alert("Experiment complete!");
            }
        }

        loadPage(currentIndex);

        window.addEventListener("message", function(event) {
            if (event.data && event.data.action === "next") {
                currentIndex++;
                loadPage(currentIndex);
            }
        });
    </script>
</body>
</html>
